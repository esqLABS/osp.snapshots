name: Check against released dependencies

# Nightly R-CMD-check against the latest *released* OSP dependencies, which come
# from the OSP R-universe (see Additional_repositories in DESCRIPTION). The
# reusable workflow pins Remotes to @*release, so the development ospsuite
# named in Remotes is swapped for its latest GitHub release.
#
# While the Imports floor on ospsuite sits on a development (.9000-series)
# version, this check is expected to fail: no released ospsuite satisfies it
# yet. A failure here then means "an ospsuite release is needed before
# osp.snapshots can be released", not a bug in this package.

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3 AM UTC daily
  workflow_dispatch:

permissions: read-all

jobs:
  check-released-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-released-deps.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
