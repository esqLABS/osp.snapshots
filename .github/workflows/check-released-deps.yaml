name: Check against released dependencies

# Nightly R-CMD-check against the latest *released* OSP dependencies, which come
# from the OSP R-universe (see Additional_repositories in DESCRIPTION). The
# reusable workflow also pins Remotes to @*release, which is a no-op while there
# is no Remotes entry to pin.
#
# This is the only nightly dependency check: with no Remotes entry there is no
# unreleased ospsuite to resolve, so nothing checks this package against a
# development OSP dependency. Reinstating that needs a deliberate Remotes entry
# plus an Imports floor on the corresponding .9000 version.

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3 AM UTC daily
  workflow_dispatch:

permissions: read-all

jobs:
  check-released-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-released-deps.yaml@main
    with:
      # ubuntu-latest is ubuntu-26.04, which has no libxml2.so.2, so ospsuite
      # cannot load its .NET assemblies. Pin Ubuntu to 24.04 until it can.
      os-matrix: >-
        [{"os": "${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-24.04' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_MACOS || 'macos-latest' }}", "r": "release"}]
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
