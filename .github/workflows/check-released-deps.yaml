name: Check against released dependencies

# Nightly R-CMD-check against the latest *released* OSP dependencies: the
# reusable workflow pins Remotes to @*release before checking. With no Remotes
# entry left in DESCRIPTION that pin is a no-op and the released ospsuite comes
# from the OSP R-universe instead, so this currently matches check-dev-deps.yaml.

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3 AM UTC daily
  workflow_dispatch:

permissions: read-all

jobs:
  check-released-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-released-deps.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
