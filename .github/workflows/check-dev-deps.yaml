name: Check against development dependencies

# Nightly R-CMD-check against the OSP dependencies as DESCRIPTION declares them.
# Now that they resolve from the OSP R-universe rather than a Remotes entry, that
# means the released ospsuite, which is what check-released-deps.yaml also gets:
# the two are equivalent until a Remotes entry pointing at an unreleased OSP
# package is deliberately added back here.

on:
  schedule:
    - cron: '0 4 * * *' # Run at 4 AM UTC daily (after released-deps at 3 AM)
  workflow_dispatch:

permissions: read-all

jobs:
  check-dev-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      setup-quarto: true
      extra-packages: local::.
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
