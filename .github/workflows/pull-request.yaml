name: Pull Request Workflow

# Runs on every pull request. OSP dependencies resolve from the OSP R-universe
# (see Additional_repositories in DESCRIPTION), so the checks run directly on the
# PR tree with no DESCRIPTION rewriting beforehand.

on:
  pull_request:

permissions: read-all

jobs:
  R-CMD-Check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      # ubuntu-latest is ubuntu-26.04, which has no libxml2.so.2, so ospsuite
      # cannot load its .NET assemblies. Pin Ubuntu to 24.04 until it can.
      os-matrix: >-
        [{"os": "${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-24.04' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_MACOS || 'macos-latest' }}", "r": "release"}]
      setup-quarto: true
      extra-packages: local::.
      extra-repositories: https://open-systems-pharmacology.r-universe.dev

  test-coverage:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/test-coverage.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lychee-link-check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/Check_URLs.yml@main

  pkgdown:
    permissions:
      contents: write # required by the pkgdown reusable workflow (no deploy on PRs)
      pull-requests: read # the workflow's check-changes job reads PR file changes
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
